<title id="title">Two CT-guided traces stay on their own sheet in one artificial scene</title>
<desc id="desc">Fixed normal-Z CT branch control. Both complete finished curves follow their own artificial A/B references; the original complete A-to-B raw curve is a pale dashed background. Original unmasked P validates all 322 raw/finished segments. Whole-arc ratios are a descriptive comparison to the two original unconstrained raw whole curves.</desc>
